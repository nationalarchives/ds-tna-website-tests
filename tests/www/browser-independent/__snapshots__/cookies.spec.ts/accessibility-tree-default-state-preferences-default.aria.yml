- paragraph: This page has a brief explanation of each of the four types of cookie The National Archives uses. You can choose which cookies you’re happy for us to use.
- paragraph:
  - text: For a full breakdown, see
  - link "our detailed cookie information":
    - /url: /https:\/\/((dev-|staging-)?www.nationalarchives.gov.uk|localhost)\/cookies\/details\//
  - text: .
- heading "Cookie preferences" [level=2]
- paragraph: We use 4 types of cookie. You can choose which cookies you’re happy for us to use.
- heading "Cookies that measure website use" [level=2]
- paragraph: We use Google Analytics cookies to measure how you use National Archives websites.
- paragraph: "These cookies collect information about:"
- list:
  - listitem: how you got to these sites
  - listitem: the pages you visit and how long you spend on each page
  - listitem: what you click on while you’re visiting these sites
- paragraph: We do not allow Google to use or share this data for their own purposes.
- group "Do you allow cookies that measure website use?":
  - text: ""
  - radio "Use cookies that measure my website use"
  - text: Use cookies that measure my website use
  - radio "Do not use cookies that measure my website use" [checked]
  - text: Do not use cookies that measure my website use
- heading "Cookies that help with our communications and marketing" [level=2]
- paragraph: These cookies may be set by third party websites and do things like measure how you view YouTube videos that are on our websites.
- group "Do you allow cookies that help with communications and marketing?":
  - text: ""
  - radio "Use cookies that help with communications and marketing"
  - text: ""
  - radio "Do not use cookies that help with communications and marketing" [checked]
  - text: Do not use cookies that help with communications and marketing
- heading "Cookies that remember your settings" [level=2]
- paragraph: These cookies do things like remember your preferences and the choices you make, to personalise your experience of using the site.
- group "Do you allow cookies that remember your settings?":
  - text: ""
  - radio "Use cookies that remember my settings on the site"
  - text: Use cookies that remember my settings on the site
  - radio "Do not use cookies that remember my settings on the site" [checked]
  - text: Do not use cookies that remember my settings on the site
- heading "Strictly necessary cookies" [level=2]
- paragraph: These essential cookies do things like allow you to progress through a form or to remain logged in to some of our services.
- paragraph: They always need to be on.
- button "Save changes"