name: Run tests for PR against develop

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-image:
    uses: ./.github/workflows/playwright-image.yml

  test-pr:
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Get header value
        run: |
          echo "TEST_ACCESS_HEADER=${{ secrets.TEST_HEADER_DEV }}" >> $GITHUB_ENV
          echo "TEST_WAGTAIL_API_TOKEN=${{ secrets.TEST_WAGTAIL_API_TOKEN_DEV }}" >> $GITHUB_ENV
      - name: Install Node dependencies
        run: npm ci
      - name: Run tests
        run: ENVIRONMENT="develop" TEST_ACCESS_HEADER="${TEST_ACCESS_HEADER}" TEST_WAGTAIL_API_TOKEN="${TEST_WAGTAIL_API_TOKEN}" CI=true npx playwright test --grep-invert "@wip"
        env:
          HOME: /root
